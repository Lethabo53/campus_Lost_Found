<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body { visibility: hidden; }
    html[data-authed] body { visibility: visible; }
</style>
<script>
(function () {
    fetch('me.php', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (!data.user) {
                location.href = 'auth.html?redirect=' + encodeURIComponent(location.pathname + location.search);
            } else {
                document.documentElement.setAttribute('data-authed', '1');
            }
        })
        .catch(function () {
            location.href = 'auth.html';
        });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item details — Campus Lost &amp; Found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">L&amp;F</span> Campus Lost &amp; Found</a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="browse.html">Browse</a>
            <a href="rewards.html">My Rewards</a>
            <a href="admin.html">Dashboard</a>
            <a href="donation.html">Donations</a>
            <a href="logout.php" id="nav-auth" class="nav-auth-link">Sign out</a>
        </nav>
    </div>
</header>

<section class="section">
    <div class="wrap" style="max-width:760px;">
        <div id="item-root"><p class="muted">Loading item…</p></div>
    </div>
</section>

<footer><div class="wrap">Campus Lost &amp; Found — a student affairs digital initiative.</div></footer>

<script src="js/app.js?v=3"></script>
<script>
const itemId = new URLSearchParams(location.search).get('id');

function statusLabel(status) {
    const labels = {
        open: 'Open', matched: 'Matched', claimed: 'Claimed',
        reunited: 'Reunited', donated: 'Donated', closed: 'Closed'
    };
    return labels[status] || status;
}

function matchRowHtml(m) {
    return `
        <a class="ticket" href="item-detail.html?id=${m.found_item_id}" style="margin-bottom:10px;">
            <div class="ticket-stub"></div>
            <div class="ticket-body">
                <div class="ticket-top">
                    <span class="ticket-code">${escapeHtml(m.ticket_code)}</span>
                    <span class="status-pill" style="background:var(--success-bg); color:var(--sage-dark);">${m.score}% match</span>
                </div>
                <h3 class="ticket-title">${escapeHtml(m.title)}</h3>
                <div class="ticket-meta">
                    ${m.location_name ? `<span>📍 ${escapeHtml(m.location_name)}</span>` : ''}
                    <span>${escapeHtml(m.category)}</span>
                </div>
            </div>
        </a>
    `;
}

function claimFormHtml() {
    return `
        <div class="card" style="margin-top:20px;" id="claim-card">
            <h3 class="mt-0">Is this yours?</h3>
            <p class="small">Answer both questions the finder set. If they match, your claim goes to the campus admin, who will contact you to arrange the hand-over. The finder's details stay private.</p>
            <form id="claim-form">
                <div class="field">
                    <label id="claim-q1-label" for="claim-answer-1">Question 1</label>
                    <input type="text" id="claim-answer-1" required>
                </div>
                <div class="field">
                    <label id="claim-q2-label" for="claim-answer-2">Question 2</label>
                    <input type="text" id="claim-answer-2" required>
                </div>
                <div id="claim-error" class="small" style="color:var(--danger); display:none; margin-bottom:12px;"></div>
                <button class="btn btn-sage" type="submit">Verify &amp; claim</button>
            </form>
            <div id="claim-success" style="display:none; margin-top:14px;"></div>
        </div>
    `;
}


function editCardHtml(item) {
    const cats = ['ID/Card','Electronics','Bag','Clothing','Keys','Sports Gear','Books','Other'];
    if (item.category && !cats.includes(item.category)) cats.push(item.category);
    const isFound = item.report_type === 'found';
    const v = (x) => escapeHtml(x == null ? '' : String(x));
    const today = new Date(); const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    const note = item.is_admin
        ? 'As admin you can edit any report, including the security questions.'
        : (item.approval_status === 'rejected'
            ? 'The admin rejected this report. Fix the details and save: it goes back to the admin for approval.'
            : 'You can edit this report until the admin approves it. After approval it is locked.');
    return `
        <div class="card" style="margin-top:20px;" id="edit-card">
            <h3 class="mt-0">Edit this report</h3>
            <p class="small">${note}</p>
            <button class="btn btn-outline" type="button" id="edit-toggle">Edit report</button>
            <form id="edit-form" style="display:none; margin-top:16px;">
                <div class="field"><label for="ed-title">Title</label><input id="ed-title" maxlength="200" required value="${v(item.title)}"></div>
                <div class="form-grid">
                    <div class="field"><label for="ed-category">Category</label>
                        <select id="ed-category" required>${cats.map(c => `<option ${c === item.category ? 'selected' : ''}>${v(c)}</option>`).join('')}</select></div>
                    <div class="field"><label for="ed-color">Colour</label><input id="ed-color" maxlength="100" value="${v(item.color)}"></div>
                </div>
                <div class="field"><label for="ed-description">Description</label><textarea id="ed-description" rows="4" required>${v(item.description)}</textarea></div>
                <div class="form-grid">
                    <div class="field"><label for="ed-brand">Brand / model <span class="hint">(optional)</span></label><input id="ed-brand" maxlength="150" value="${v(item.brand_model)}"></div>
                    <div class="field"><label for="ed-date">${isFound ? 'Date found' : 'Date lost'}</label><input type="date" id="ed-date" max="${todayStr}" required value="${v(item.event_date)}"></div>
                </div>
                ${isFound ? `<div class="field"><label for="ed-condition">Condition <span class="hint">(optional)</span></label><input id="ed-condition" maxlength="255" value="${v(item.condition_notes)}"></div>` : ''}
                ${(isFound && item.is_admin) ? `
                    <div class="form-grid">
                        <div class="field"><label for="ed-q1">Security question 1</label><input id="ed-q1" maxlength="255" required value="${v(item.security_question_1)}"></div>
                        <div class="field"><label for="ed-a1">Expected answer 1</label><input id="ed-a1" maxlength="255" required value="${v(item.security_answer_1)}"></div>
                        <div class="field"><label for="ed-q2">Security question 2</label><input id="ed-q2" maxlength="255" required value="${v(item.security_question_2)}"></div>
                        <div class="field"><label for="ed-a2">Expected answer 2</label><input id="ed-a2" maxlength="255" required value="${v(item.security_answer_2)}"></div>
                    </div>` : ''}
                <div id="edit-error" class="small" style="color:var(--danger); display:none; margin-bottom:10px;"></div>
                <button class="btn btn-sage" type="submit">Save changes</button>
                <button class="btn btn-outline" type="button" id="edit-cancel">Cancel</button>
            </form>
        </div>`;
}

function wireEditCard(item) {
    const form = document.getElementById('edit-form');
    if (!form) return;
    const toggle = document.getElementById('edit-toggle');
    toggle.addEventListener('click', () => { form.style.display = 'block'; toggle.style.display = 'none'; });
    document.getElementById('edit-cancel').addEventListener('click', () => { form.style.display = 'none'; toggle.style.display = 'inline-flex'; });
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('edit-error'); err.style.display = 'none';
        const val = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
        const body = {
            item_id: item.id,
            title: val('ed-title'), category: val('ed-category'), color: val('ed-color'),
            description: val('ed-description'), brand_model: val('ed-brand'),
            condition_notes: val('ed-condition') || '', event_date: val('ed-date')
        };
        if (document.getElementById('ed-q1')) {
            body.security_question_1 = val('ed-q1'); body.security_answer_1 = val('ed-a1');
            body.security_question_2 = val('ed-q2'); body.security_answer_2 = val('ed-a2');
        }
        try {
            const res = await api('edit_item.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            toast(res.message || 'Saved');
            setTimeout(() => location.reload(), 700);
        } catch (ex) { err.textContent = ex.message || 'Could not save.'; err.style.display = 'block'; }
    });
}

async function load() {
    const root = document.getElementById('item-root');

    if (!itemId) {
        root.innerHTML = '<p class="empty-state">No item specified.</p>';
        return;
    }

    try {
        const { item, matches } = await api('item_detail.php?id=' + encodeURIComponent(itemId));

        const isLost = item.report_type === 'lost';
        const isFound = item.report_type === 'found';
        const canClaim = isFound && item.approval_status === 'approved' && !item.is_owner && (item.status === 'open' || item.status === 'matched');
        const showCountdown = isFound && item.approval_status === 'approved' && (item.status === 'open' || item.status === 'matched');
        const canEdit = item.is_admin || (item.is_owner && (item.approval_status === 'pending' || item.approval_status === 'rejected'));
        const canCloseOwn = isLost && item.is_owner && (item.status === 'open' || item.status === 'matched');

        const photoClearClass = isLost ? 'is-clear' : '';
        const photoHtml = item.photo
            ? `<img src="${escapeHtml(item.photo)}" alt="${escapeHtml(item.title)}" class="ticket-photo ${photoClearClass}" id="item-photo" style="height:260px; margin-top:16px;">`
            : '';

        root.innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
                    <div>
                        <span class="ticket-code">${escapeHtml(item.ticket_code)}</span>
                        <h1 style="margin-top:6px;">${escapeHtml(item.title)}</h1>
                    </div>
                    <span class="ticket-tag ${isLost ? 'tag-lost' : 'tag-found'}">${isLost ? '🔍 Lost' : '✅ Found'}</span>
                </div>
                <div class="ticket-meta" style="margin:10px 0 4px;">
                    ${item.location_name ? `<span>📍 ${escapeHtml(item.location_name)}</span>` : ''}
                    <span>📅 ${escapeHtml(item.event_date)}</span>
                    <span>${escapeHtml(item.category)}</span>
                    ${item.color ? `<span>Color: ${escapeHtml(item.color)}</span>` : ''}
                    ${item.brand_model ? `<span>${escapeHtml(item.brand_model)}</span>` : ''}
                    <span class="status-pill status-${escapeHtml(item.status)}">${statusLabel(item.status)}</span>
                    ${item.urgent ? '<span class="ticket-tag tag-urgent">Urgent</span>' : ''}
                </div>
                <p style="margin-top:14px;">${escapeHtml(item.description)}</p>
                ${item.condition_notes ? `<p class="small muted">Condition notes: ${escapeHtml(item.condition_notes)}</p>` : ''}
                ${photoHtml}
            </div>

            ${item.approval_status === 'pending' ? `
                <div class="card" style="margin-top:20px; border-color:var(--gold);">
                    <h3 class="mt-0">⏳ Waiting for admin approval</h3>
                    <p class="small">The admin reviews every report before it is shown to everyone on the site. You will see it on the Browse page as soon as it is approved.</p>
                </div>` : ''}
            ${item.approval_status === 'rejected' ? `
                <div class="card" style="margin-top:20px; border-color:var(--danger);">
                    <h3 class="mt-0">This report was not approved</h3>
                    <p class="small"><b>Reason from the admin:</b> ${escapeHtml(item.rejection_reason || 'It did not meet the reporting guidelines.')}</p>
                    ${item.is_owner ? `<p class="small">Fix the details below and save. It will go back to the admin for approval.</p>
                    <a class="btn btn-sage" href="#edit-card" onclick="var t=document.getElementById('edit-toggle'); if (t) t.click();">Edit and resubmit</a>` : ''}
                </div>` : ''}
            ${item.is_admin ? `
                <div class="card" style="margin-top:20px; border-color:var(--sage);">
                    <h3 class="mt-0">Admin view</h3>
                    <p class="small"><strong>Reported by:</strong> ${escapeHtml(item.reporter_name || '')} — ${escapeHtml(item.reporter_email || '')}</p>
                    ${item.report_type === 'found' ? `
                    <p class="small"><strong>Q1:</strong> ${escapeHtml(item.security_question_1 || '')}<br><strong>A1:</strong> ${escapeHtml(item.security_answer_1 || '')}</p>
                    <p class="small"><strong>Q2:</strong> ${escapeHtml(item.security_question_2 || '')}<br><strong>A2:</strong> ${escapeHtml(item.security_answer_2 || '')}</p>` : ''}
                    <a class="btn btn-outline" href="admin-console.html">Open the admin console</a>
                </div>` : ''}

            ${showCountdown ? `
                <div class="card" style="margin-top:20px;" id="countdown-card">
                    <h3 class="mt-0">⏳ Claim window</h3>
                    <p class="small">Unclaimed items are donated to charity 30 days (720 hours) after they were reported.</p>
                    <div id="countdown-hours" style="font-family:var(--font-mono); font-size:2.2rem; font-weight:600; color:var(--sage-dark); margin:6px 0;">—</div>
                    <div id="countdown-detail" class="small muted"></div>
                </div>
            ` : ''}

            ${canCloseOwn ? `
                <div class="card" style="margin-top:20px;" id="own-card">
                    <h3 class="mt-0">Got your item back?</h3>
                    <p class="small">If you have found or recovered this item yourself, mark it as found to close this report. Reward points are only given to people who hand in items that belong to someone else.</p>
                    <button class="btn btn-sage" type="button" id="mark-found-btn">I found my item</button>
                </div>
            ` : ''}

            ${(!item.is_admin && (item.approval_status === 'approved' || item.is_owner)) ? `
                <div class="card" style="margin-top:20px;">
                    <h3 class="mt-0">Need help with this item?</h3>
                    <p class="small">Write to the campus admin about this item, for example to say it is yours or to ask how to collect it.</p>
                    <a class="btn btn-outline" href="messages.html?item=${item.id}">Message the admin</a>
                </div>` : ''}

            ${canEdit ? editCardHtml(item) : ''}

            ${canClaim ? claimFormHtml() : ''}

            ${isLost && matches && matches.length ? `
                <div class="card" style="margin-top:20px;">
                    <h3 class="mt-0">Possible matches</h3>
                    ${matches.map(matchRowHtml).join('')}
                </div>
            ` : ''}
        `;

        wireEditCard(item);

        if (showCountdown) {
            let remaining = item.seconds_left;
            const hoursEl = document.getElementById('countdown-hours');
            const detailEl = document.getElementById('countdown-detail');
            function tick() {
                if (remaining <= 0) {
                    hoursEl.textContent = '0 hours';
                    detailEl.textContent = 'The claim window has ended. This item is now eligible for donation.';
                    return;
                }
                const totalHours = Math.ceil(remaining / 3600);
                const d = Math.floor(remaining / 86400);
                const h = Math.floor((remaining % 86400) / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const sec = remaining % 60;
                hoursEl.textContent = totalHours + (totalHours === 1 ? ' hour left' : ' hours left');
                detailEl.textContent = d + 'd ' + h + 'h ' + m + 'm ' + sec + 's remaining — counted from the day this item was reported.';
                remaining--;
                setTimeout(tick, 1000);
            }
            tick();
        }

        if (canCloseOwn) {
            document.getElementById('mark-found-btn').addEventListener('click', async (e) => {
                if (!confirm('Mark this item as found and close your report?')) return;
                const btn = e.target;
                btn.disabled = true;
                try {
                    await api('mark_found.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ item_id: item.id })
                    });
                    toast('Great! Your report has been closed.');
                    setTimeout(() => location.reload(), 900);
                } catch (err) {
                    btn.disabled = false;
                    toast('Error: ' + err.message);
                }
            });
        }

        if (canClaim) {
            document.getElementById('claim-q1-label').textContent = item.security_question_1 || 'Question 1';
            document.getElementById('claim-q2-label').textContent = item.security_question_2 || 'Question 2';

            document.getElementById('claim-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('claim-error');
                errEl.style.display = 'none';

                try {
                    const res = await api('verify_claim.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            item_id: item.id,
                            answer_1: document.getElementById('claim-answer-1').value,
                            answer_2: document.getElementById('claim-answer-2').value
                        })
                    });

                    document.getElementById('claim-form').style.display = 'none';
                    const successEl = document.getElementById('claim-success');
                    successEl.style.display = 'block';
                    successEl.innerHTML = `
                        <p class="small" style="color:var(--sage-dark); font-weight:600;">✅ ${escapeHtml(res.message)}</p>
                        <p class="small muted">Keep an eye on your student email — the admin will get in touch with you.</p>
                    `;
                    const photo = document.getElementById('item-photo');
                    if (photo) photo.classList.add('is-clear');
                    toast('Claim sent to the admin');
                } catch (err) {
                    errEl.textContent = err.message;
                    errEl.style.display = 'block';
                }
            });
        }

    } catch (e) {
        root.innerHTML = `<p class="empty-state">Couldn't load this item: ${escapeHtml(e.message)}</p>`;
    }
}

load();
</script>
<script src="js/chatbot.js"></script>
</body>
</html>
