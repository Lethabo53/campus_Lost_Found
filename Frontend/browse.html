<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body { visibility: hidden; }
    html[data-authed] body { visibility: visible; }
</style>
<script>
(function () {
    fetch('me.php', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (!data.user) {
                location.href = 'auth.html?redirect=' + encodeURIComponent(location.pathname + location.search);
            } else {
                document.documentElement.setAttribute('data-authed', '1');
            }
        })
        .catch(function () {
            location.href = 'auth.html';
        });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse — Campus Lost &amp; Found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="home.html"><span class="brand-mark">L&amp;F</span> Campus Lost &amp; Found</a>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="browse.html" class="active">Browse</a>
            <a href="rewards.html">My Rewards</a>
            <a href="admin.html">Dashboard</a>
            <a href="donation.html">Donations</a>
            <a href="logout.php" id="nav-auth" class="nav-auth-link">Sign out</a>
        </nav>
    </div>
</header>

<section class="section">
    <div class="wrap">
        <h1>Browse reports</h1>

        <div class="filters">
            <button class="filter-toggle active" data-type="">All</button>
            <button class="filter-toggle" data-type="lost">Lost</button>
            <button class="filter-toggle" data-type="found">Found</button>
            <button class="filter-toggle" data-type="" data-mine="1">My reports</button>
            <select id="category-filter">
                <option value="">Any category</option>
                <option>ID/Card</option><option>Electronics</option><option>Bag</option>
                <option>Clothing</option><option>Keys</option><option>Sports Gear</option>
                <option>Books</option><option>Other</option>
            </select>
            <select id="sort-filter">
                <option value="newest">Newest first</option>
                <option value="urgent">Urgent first</option>
                <option value="location">By location</option>
            </select>
            <input type="text" id="q-filter" placeholder="Search keyword…">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
            <span class="muted small" id="result-count"></span>
        </div>

        <div class="ticket-grid" id="results">
            <p class="muted">Loading…</p>
        </div>
    </div>
</section>

<script src="js/app.js?v=3"></script>
<script>
let state = { type: '', category: '', sort: 'newest', q: '', mine: '' };

function syncFromQuery() {
    const params = new URLSearchParams(location.search);
    if (params.get('q')) { state.q = params.get('q'); document.getElementById('q-filter').value = state.q; }
}

async function load() {
    const grid = document.getElementById('results');
    grid.innerHTML = '<p class="muted">Loading…</p>';
    try {
        const qs = new URLSearchParams({ type: state.type, category: state.category, sort: state.sort, q: state.q, mine: state.mine });
        const data = await api('browse.php?' + qs.toString());
        document.getElementById('result-count').textContent = `${data.items.length} result${data.items.length === 1 ? '' : 's'}`;
        grid.innerHTML = data.items.length
            ? data.items.map(ticketCardHtml).join('')
            : '<p class="empty-state">Nothing matches those filters yet. Try widening your search, or <a href="report-lost.html">report a new item</a>.</p>';
    } catch (e) {
        grid.innerHTML = `<p class="empty-state">Couldn't load results: ${escapeHtml(e.message)}</p>`;
    }
}

document.querySelectorAll('.filter-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-toggle').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.type = btn.dataset.type;
        state.mine = btn.dataset.mine || '';
        load();
    });
});
document.getElementById('category-filter').addEventListener('change', e => { state.category = e.target.value; load(); });
document.getElementById('sort-filter').addEventListener('change', e => { state.sort = e.target.value; load(); });
let qTimer;
document.getElementById('q-filter').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value; load(); }, 350);
});

syncFromQuery();
load();
</script>
<script src="js/chatbot.js"></script>
</body>
</html>
