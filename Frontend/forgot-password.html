<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Campus Lost &amp; Found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="index.html"><span class="brand-mark">L&amp;F</span> Campus Lost &amp; Found</a>
        <nav class="nav-links">
            <a href="auth.html">Sign in</a>
        </nav>
    </div>
</header>

<section class="section" style="max-width:480px; margin:0 auto;">
    <div class="wrap">
        <div class="card">
            <h3 class="mt-0">Forgot your password?</h3>
            <p class="small">Enter the email you signed up with. We'll generate a reset link for it.</p>

            <form id="forgot-form">
                <div class="field">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" required>
                </div>
                <div id="forgot-error" class="small" style="color:var(--danger); display:none; margin-bottom:12px;"></div>
                <button class="btn btn-sage btn-block" type="submit">Send reset link</button>
            </form>

            <div id="forgot-result" style="display:none; margin-top:18px;"></div>

            <p class="small" style="margin-top:18px;"><a href="auth.html">&larr; Back to sign in</a></p>
        </div>
    </div>
</section>

<footer><div class="wrap">Campus Lost &amp; Found — a student affairs digital initiative.</div></footer>

<script src="js/app.js?v=3"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('forgot-error');
    errEl.style.display = 'none';

    try {
        const res = await api('forgot-password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('forgot-email').value })
        });

        document.getElementById('forgot-form').style.display = 'none';
        const resultEl = document.getElementById('forgot-result');
        resultEl.style.display = 'block';

        if (res.reset_link) {
            resultEl.innerHTML = `
                <p class="small" style="color:var(--sage-dark); font-weight:600;">✅ ${escapeHtml(res.message)}</p>
                <p class="small muted">${escapeHtml(res.dev_note)}</p>
                <a class="btn btn-sage btn-block" href="${res.reset_link}" style="margin-top:10px;">Reset your password</a>
            `;
        } else {
            resultEl.innerHTML = `<p class="small" style="color:var(--sage-dark); font-weight:600;">✅ ${escapeHtml(res.message)}</p>`;
        }
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
    }
});
</script>
</body>
</html>
