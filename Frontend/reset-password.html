<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Campus Lost &amp; Found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="index.html"><span class="brand-mark">L&amp;F</span> Campus Lost &amp; Found</a>
        <nav class="nav-links">
            <a href="auth.html">Sign in</a>
        </nav>
    </div>
</header>

<section class="section" style="max-width:480px; margin:0 auto;">
    <div class="wrap">
        <div class="card">
            <h3 class="mt-0">Choose a new password</h3>

            <form id="reset-form">
                <div class="field">
                    <label for="reset-password-1">New password</label>
                    <input type="password" id="reset-password-1" minlength="8" required>
                    <span class="hint">At least 8 characters.</span>
                </div>
                <div class="field">
                    <label for="reset-password-2">Confirm new password</label>
                    <input type="password" id="reset-password-2" minlength="8" required>
                </div>
                <div id="reset-error" class="small" style="color:var(--danger); display:none; margin-bottom:12px;"></div>
                <button class="btn btn-sage btn-block" type="submit">Reset password</button>
            </form>

            <div id="reset-result" style="display:none; margin-top:18px;"></div>
        </div>
    </div>
</section>

<footer><div class="wrap">Campus Lost &amp; Found — a student affairs digital initiative.</div></footer>

<script src="js/app.js?v=3"></script>
<script>
const params = new URLSearchParams(location.search);
const email = params.get('email') || '';
const token = params.get('token') || '';

if (!email || !token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('reset-result').style.display = 'block';
    document.getElementById('reset-result').innerHTML =
        '<p class="empty-state">This reset link is missing information. Please request a new one from the <a href="forgot-password.html">forgot password</a> page.</p>';
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('reset-error');
    errEl.style.display = 'none';

    const p1 = document.getElementById('reset-password-1').value;
    const p2 = document.getElementById('reset-password-2').value;

    if (p1 !== p2) {
        errEl.textContent = "Passwords don't match.";
        errEl.style.display = 'block';
        return;
    }

    try {
        const res = await api('reset-password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, password: p1 })
        });

        document.getElementById('reset-form').style.display = 'none';
        const resultEl = document.getElementById('reset-result');
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
            <p class="small" style="color:var(--sage-dark); font-weight:600;">✅ ${escapeHtml(res.message)}</p>
            <a class="btn btn-sage btn-block" href="auth.html" style="margin-top:10px;">Go to sign in</a>
        `;
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
    }
});
</script>
</body>
</html>
